name: Build Anambra Community Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Sanitize Mobile Paste & Fix Encoding
        run: |
          # Fix hidden non-breaking spaces (U+00A0) frequently inserted by phone copy-paste
          sed -i 's/\xc2\xa0/ /g' lib/main.dart 2>/dev/null || true
          # Remove DOS carriage returns if any
          sed -i 's/\r$//' lib/main.dart 2>/dev/null || true

      - name: Setup Android Scaffolding and Permissions
        run: |
          # 1. Recreate clean Android scaffolding
          rm -rf android
          flutter create --platforms=android --org=com.example .

          # 2. Configure FlutterFragmentActivity for local_auth (biometrics)
          find android -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          find android -name "MainActivity.kt" -exec sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' {} +

          # 3. Set minSdkVersion to 23 for biometric & geolocator compatibility
          find android -name "build.gradle" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +
          find android -name "build.gradle.kts" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} +
          echo "flutter.minSdkVersion=23" >> android/local.properties

          # 4. Inject Emergency and Biometric permissions into AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.SEND_SMS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CALL_PHONE" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Validate Dependencies and Code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/main.dart

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anambra-community-alert-apk
          path: build/app/outputs/flutter-apk/app-release.apk
