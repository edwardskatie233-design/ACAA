name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix V1 Embedding and Android Scaffolding
        run: |
          # 1. Remove deleted v1 embedding packages if present
          sed -i '/telephony/d' pubspec.yaml

          # 2. Recreate clean Android v2 embedding structure
          rm -rf android
          flutter create --platforms=android --org=com.example .

          # 3. Configure minSdkVersion 23 for local_auth & geolocator
          echo "flutter.minSdkVersion=23" >> android/local.properties

          # 4. Inject required emergency permissions into AndroidManifest
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.SEND_SMS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CALL_PHONE" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anambra-community-alert-apk
          path: build/app/outputs/flutter-apk/app-release.apk
